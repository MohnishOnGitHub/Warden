# Warden settings. Loaded and validated by app/settings.py at import.

# Judge risk score floors: at or above judge_block_score the action is BLOCKed,
# at or above judge_approval_score it needs approval at the very least.
judge_block_score: 70
judge_approval_score: 40

# Total time budget for one judge decision, retries and fallback model included.
judge_timeout_seconds: 15

# Approver used when the judge (or an unavailable judge) sends an ALLOWed action to approval.
fallback_approver: sam.t

# How long an approval request stays open before it expires and the ticket is escalated.
# DEMO_MODE=1 uses the shorter demo value.
approval_ttl_minutes: 10
approval_ttl_minutes_demo: 2

# API: how often overdue approvals are expired, how long a Gemini health check is reused
# (the dashboard polls every 2 seconds), and how many agent runs may use the LLM at once (paid tier).
expiry_sweep_seconds: 10
health_cache_seconds: 60
max_concurrent_agents: 5
